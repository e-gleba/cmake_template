# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# CodeRabbit AI review — first-pass only: reads code, writes PR comments,
# never requests changes, never blocks merges (issue #17).
# Config reference: https://docs.coderabbit.ai/guides/configuration-file
#
# Activation: install the CodeRabbit GitHub App on this repo (free for OSS).
# NOTE: CodeRabbit reads this file from the repository ROOT only —
# .github/ is not a supported location.

language: en-US
early_access: false

# Schema cap: 250 characters. Currently 237.
tone_instructions: |-
  Concise, technical, no pleasantries. Fix first, then impact.
  Ground C++ claims in cppreference or the C++ draft; mark
  unverified claims [unverified]. Perf claims need measurements.
  Follow CLAUDE.md. Changed lines only; no drive-by edits.

reviews:
  profile: chill
  # Comments only — the bot must never block a merge.
  request_changes_workflow: false
  fail_commit_status: false
  high_level_summary: true
  collapse_walkthrough: true
  sequence_diagrams: false
  poem: false
  suggested_labels: true
  suggested_reviewers: false
  auto_review:
    enabled: true
    # Never spam Draft PRs or WIP branches.
    drafts: false
    ignore_title_keywords:
      - wip
      - draft
  path_filters:
    # Generated / vendored trees — never review these.
    - "!**/build/**"
    - "!**/_deps/**"
    - "!.emsdk/**"
    - "!android_project/.gradle/**"
    - "!**/node_modules/**"
  path_instructions:
    - path: "**/CMakeLists.txt"
      instructions: >-
        Modern CMake 4.4+ only: target_* commands over directory/global
        state — flag include_directories(), add_definitions(), and
        CMAKE_CXX_FLAGS mutations. Headers belong in
        target_sources(... FILE_SET ...). CPM.cmake is the only dependency
        mechanism: flag new find_package calls, conanfile.txt, or
        vcpkg.json (tracked in issues #3 and #8). Keep FETCHCONTENT_QUIET
        OFF. Must stay .cmake-format.yaml clean.
    - path: "cmake/**"
      instructions: >-
        Same rules as the root CMakeLists.txt: target_* over globals, no
        ad-hoc platform hacks — cross-compilation logic lives in presets
        or cmake/toolchains/*.cmake. warnings.cmake and
        code_quality.cmake stay per-toolchain and opt-in.
    - path: "CMakePresets.json"
      instructions: >-
        Schema v12, CMake >= 4.4. Naming: '<compiler>-<variant>'
        configure, '<name>-release/debug' build, '<name>-package' CPack,
        '<name>-full' workflow. Every native configure preset needs
        matching build and test presets; cross presets (android-*,
        llvm-mingw-*) disable test. binaryDir stays build/<preset>.
        Keep the vendor block minimal.
    - path: "src/**"
      instructions: |-
        Review as C++23 project code. Where these rules conflict with nearby
        code, follow existing code and report the conflict instead of forcing
        an unrelated rewrite.

        Review in this order: lifetime and ownership; undefined behavior;
        uninitialized state and narrowing; concurrency; error paths; public
        and binary interface impact; measured performance; style last.

        All project-owned declarations live in namespace tb; only main may
        remain global. Internals use tb::detail and must not leak through
        public headers. Never add file-scope using namespace directives.

        Use std::int32_t/std::uint32_t/std::int64_t/std::uint64_t with std::
        qualification for fixed-width values. Use std::size_t for sizes and
        indices, std::ptrdiff_t for pointer differences, and bare int only
        when an external API requires it. Prefer initialized declarations,
        brace initialization, and designated initializers for aggregates.
        Add final to project types not designed as bases.

        Prefer value semantics, rule of zero, RAII, const by default, and
        unique ownership. Flag raw owning pointers, new/delete, malloc/free,
        manual resource cleanup, output parameters where return values work,
        and stored std::span/std::string_view values that may outlive their
        backing storage. Shared ownership requires an explicit lifetime need.

        Prefer the standard library, then an already-linked Boost or approved
        dependency; do not hand-roll tested facilities. Do not add a dependency
        for a small reusable facility. Prefer algorithms/ranges and named
        concepts when they improve clarity. Never return a view over a local;
        remember lazy views re-evaluate on traversal.

        Public results that matter use [[nodiscard]]. Use constexpr where
        useful at no runtime cost and noexcept only when all reachable work
        honestly cannot throw. Fallible operations return std::expected or an
        explicit checked status, never a magic value. Use existing GSL
        contracts when linked; otherwise prefer the project's dependency-free
        contract vocabulary. No exceptions across binary boundaries.

        Prefer snake_case for types, functions, variables, and namespaces;
        reserve UPPER_CASE for macros. Use class for invariant-bearing types,
        struct for plain data, and ASCII in identifiers and comments. Flag
        implicit single-argument constructors unless conversion is intended.
        Keep code clang-tidy clean per .clang-tidy.
    - path: "tests/**"
      instructions: >-
        Apply the src/** C++23 rules to test helper code. doctest only — flag
        gtest/catch2 includes. Tests register via doctest_discover_tests() in
        tests/CMakeLists.txt; CTest preset names mirror build presets
        (gcc-release, clang-debug, ...). Require changed behavior, error paths,
        lifetime boundaries, and contract failures to have focused tests;
        do not request unrelated coverage.
    - path: ".github/workflows/**"
      instructions: >-
        Every workflow starts with the yaml-language-server schema
        comment. The build matrix lives only in cmake_multi_platform.yml
        (workflow_call) — flag duplicated matrix jobs elsewhere. No
        platform-specific hack scripts in CI: logic belongs in presets or
        Docker. Pin actions; image names stay
        ghcr.io/${{ github.repository }}/<name>.
    - path: "docker/**"
      instructions: >-
        Toolchain images only — no source COPY. Pin official base images
        by explicit tag or digest. New images need a matrix row in
        publish-docker.yml, never a hardcoded name.
    - path: "readme.md"
      instructions: >-
        Keep under 10 KB. Quick Start <= 3 commands. The comparison table
        is the only long table allowed. Consulting block stays last; no
        sponsor badges. Flag stale links — every docs/*.md target must
        exist.
  finishing_touches:
    docstrings:
      enabled: false
  tools:
    actionlint:
      enabled: true
    cppcheck:
      enabled: true
    gitleaks:
      enabled: true
    hadolint:
      enabled: true
    markdownlint:
      enabled: true
    shellcheck:
      enabled: true
    shfmt:
      enabled: true
    yamllint:
      enabled: true

chat:
  auto_reply: true
