# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
name: setup gradle build
description: Set up JDK, Gradle, and the Android SDK pieces for the Gradle-driven Android jobs.
inputs:
  cpm-path:
    description: CPM source cache directory. AGP passes its own -DCPM_SOURCE_CACHE, which overrides the workflow-level env var — cache that directory instead of the default.
    required: false
    default: ~/.cache/cpm-cmake
  enable-kvm:
    description: Enable KVM for the Android emulator (Linux only).
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: "21"
        distribution: temurin
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v6.4.0
    - name: Cache CPM sources
      uses: actions/cache@v6
      with:
        path: ${{ inputs.cpm-path }}
        key: cpm-android_gradle-${{ hashFiles('cmake/ct_cpm.cmake', 'cmake/cpm/*.cmake') }}
        restore-keys: cpm-android_gradle-
    - name: Accept Android SDK licenses
      shell: bash
      run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
    - name: Enable KVM
      if: inputs.enable-kvm == 'true'
      shell: bash
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4ci.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
