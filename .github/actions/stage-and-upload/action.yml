# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
name: stage and upload release assets
description: >-
  Collect the packages produced in a build directory with
  cmake/scripts/stage_release_assets.cmake and upload them as one artifact.

inputs:
  build-dir:
    description: Build directory holding the CPack output.
    required: true
  artifact:
    description: Artifact name.
    required: true

runs:
  using: composite
  steps:
    - name: Stage release assets
      shell: bash
      run: cmake -DBUILD_DIR="${{ inputs.build-dir }}" -DSTAGING_DIR="${{ runner.temp }}/release-assets/${{ inputs.artifact }}" -P cmake/scripts/stage_release_assets.cmake

    # compression-level 0: the staged files are already compressed archives.
    - name: Upload release assets
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact }}
        path: ${{ runner.temp }}/release-assets/${{ inputs.artifact }}/
        if-no-files-found: error
        compression-level: 0
