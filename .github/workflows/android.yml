# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: android_ci

on:
  push:
    branches: [main]
    paths: &android_paths
      - "android_project/**"
      - ".github/workflows/android.yml"
  pull_request:
    branches: [main]
    paths: *android_paths
  workflow_dispatch:

concurrency:
  group: android_ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ANDROID_PROJECT_DIR: ${{ github.workspace }}/android_project
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm_cache
  GRADLE_OPTS: >-
    -Dorg.gradle.daemon=false
    -Dorg.gradle.parallel=true
    -Dorg.gradle.configureondemand=true
  NDK_VERSION: 30.0.14904198

jobs:
  android_build:
    name: android_gradle_x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up CMake
        uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2
      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: "21"
          distribution: temurin
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Install Android NDK
        run: yes | sdkmanager --licenses >/dev/null && sdkmanager "ndk;${NDK_VERSION}"
      - name: Cache CPM sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cpm_cache
          key: cpm-android-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}
          restore-keys: cpm-android-
      - name: Build release APK
        working-directory: ${{ env.ANDROID_PROJECT_DIR }}
        run: ./gradlew --stacktrace :app:assembleRelease
      - name: Upload release APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android_gradle_x86_64_release_apk
          path: ${{ env.ANDROID_PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          compression-level: 0

  android_instrumented_test:
    name: android_emulator_x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up CMake
        uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2
      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: "21"
          distribution: temurin
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Install Android NDK
        run: yes | sdkmanager --licenses >/dev/null && sdkmanager "ndk;${NDK_VERSION}"
      - name: Cache CPM sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cpm_cache
          key: cpm-android-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}
          restore-keys: cpm-android-
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4ci.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run instrumented tests
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          script: cd ${{ env.ANDROID_PROJECT_DIR }} && ./gradlew --stacktrace :app:connectedDebugAndroidTest --info
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android_emulator_x86_64_test_results
          path: |
            ${{ env.ANDROID_PROJECT_DIR }}/app/build/outputs/androidTest-results/
            ${{ env.ANDROID_PROJECT_DIR }}/app/build/reports/androidTests/
          if-no-files-found: warn
          compression-level: 0
