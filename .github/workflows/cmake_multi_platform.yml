# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: cmake_ci

# Denylist, not allowlist: a new source extension can no longer silently skip
# CI because nobody added it to a 20-line paths list. Only files that cannot
# change a build, test, or package output are ignored — everything else runs.
on:
  push:
    branches: [main]
    paths-ignore: &ci_ignore
      - "**/*.md"
      - "**/*.rst"
      - "**/*.txt"
      - "docs/**"
      - "assets/**"
      - "**/*.png"
      - "**/*.jpg"
      - "**/*.jpeg"
      - "**/*.svg"
      - "**/*.ico"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/*.md"
      - ".coderabbit.yaml"
      - ".cursor/**"
      - ".cursorignore"
      - ".editorconfig"
      - ".gitignore"
      - ".gitattributes"
      - "license.md"
      - "AGENTS.md"
  pull_request:
    branches: [main]
    paths-ignore: *ci_ignore
  release:
    types: [published]
  workflow_dispatch:
  workflow_call:

# PRs cancel their own stale runs; push and release runs always finish —
# cancelling a release-called build mid-matrix once cost a half-published release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm_cache
  ANDROID_PROJECT_DIR: ${{ github.workspace }}/android_project
  GRADLE_OPTS: >-
    -Dorg.gradle.daemon=false
    -Dorg.gradle.configureondemand=true

jobs:
  native_build:
    name: ${{ matrix.platform }}_${{ matrix.compiler }}_${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            compiler: clang
            arch: x86_64
            preset: linux_clang_x86_64_release_package
            artifact_name: linux_clang_x86_64
            sdl3_deps: "true"
            apt: "clang doxygen graphviz"
          - os: ubuntu-latest
            platform: linux
            compiler: gcc
            arch: x86_64
            preset: linux_gcc_x86_64_release_package
            artifact_name: linux_gcc_x86_64
            sdl3_deps: "true"
            apt: "clang doxygen graphviz"
          - os: windows-2022
            platform: windows
            compiler: msvc
            arch: x86_64
            preset: windows_msvc_x86_64_release_package
            artifact_name: windows_msvc_x86_64
            sdl3_deps: "false"
            apt: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up build
        uses: ./.github/actions/setup-cmake
        with:
          cache-key: ${{ matrix.artifact_name }}
          sdl3-deps: ${{ matrix.sdl3_deps }}
          apt-packages: ${{ matrix.apt }}
      - name: Build and test
        run: cmake --workflow --preset ${{ matrix.preset }}
      - name: Build documentation
        if: matrix.compiler == 'clang'
        run: cmake --build --preset linux_clang_x86_64_docs
      - name: Verify documentation
        if: matrix.compiler == 'clang'
        shell: bash
        run: |
          index_path="build/linux_clang_x86_64/generated_docs/html/index.html"
          test -f "${index_path}" || { echo "::error::Documentation index not found at ${index_path}"; exit 1; }
      - name: Upload documentation
        if: matrix.compiler == 'clang'
        uses: actions/upload-artifact@v7
        with:
          name: doxygen_html_${{ github.run_id }}
          path: build/linux_clang_x86_64/generated_docs/html/
          retention-days: 30
          if-no-files-found: error
      - name: Stage and upload release assets
        uses: ./.github/actions/stage-and-upload
        with:
          build-dir: build/${{ matrix.artifact_name }}
          artifact-name: release-assets-${{ matrix.artifact_name }}

  windows_cross_build:
    name: linux_${{ matrix.compiler }}_${{ matrix.arch }}_to_windows
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: llvm_mingw
            arch: x86_64
            preset: windows_llvm_mingw_x86_64_release_package
            build_dir: windows_llvm_mingw_x86_64
          - compiler: llvm_mingw
            arch: i686
            preset: windows_llvm_mingw_x86_release_package
            build_dir: windows_llvm_mingw_x86
          - compiler: llvm_mingw
            arch: aarch64
            preset: windows_llvm_mingw_aarch64_release_package
            build_dir: windows_llvm_mingw_aarch64
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up build
        uses: ./.github/actions/setup-cmake
        with:
          cache-key: windows_llvm_mingw_${{ matrix.arch }}
      - name: Cache LLVM MinGW
        uses: actions/cache@v6
        with:
          path: llvm_mingw
          key: llvm_mingw-${{ hashFiles('cmake/toolchains/llvm_mingw.cmake') }}
      - name: Build and test
        run: cmake --workflow --preset ${{ matrix.preset }}
      - name: Stage and upload release assets
        uses: ./.github/actions/stage-and-upload
        with:
          build-dir: build/${{ matrix.build_dir }}
          artifact-name: release-assets-windows-llvm-mingw-${{ matrix.arch }}

  web_build:
    name: linux_emscripten_wasm32
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up build
        uses: ./.github/actions/setup-cmake
        with:
          cache-key: web_emscripten_wasm32
      - name: Cache Emscripten SDK
        uses: actions/cache@v6
        with:
          path: .emsdk
          key: emsdk-${{ hashFiles('cmake/toolchains/emscripten.cmake') }}
      - name: Build and test
        run: cmake --workflow --preset web_emscripten_wasm32_release_test
      - name: Package web application
        shell: bash
        run: |
          mapfile -t web_files < <(find build/web_emscripten_wasm32 -type f \
            \( -name '05_webassembly.html' -o -name '05_webassembly.js' -o -name '05_webassembly.wasm' \) \
            -print | sort)
          if (( ${#web_files[@]} != 3 )); then
            printf '::error::expected html, JavaScript, and WebAssembly outputs; found %d\n' "${#web_files[@]}"
            exit 1
          fi
          staging_dir="${RUNNER_TEMP}/release-assets"
          mkdir -p "${staging_dir}"
          cmake -E tar cf "${staging_dir}/cxx_project-Web_Emscripten_wasm32.zip" \
            --format=zip -- "${web_files[@]}"
      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-web-emscripten-wasm32
          path: ${{ runner.temp }}/release-assets/
          if-no-files-found: error
          compression-level: 0

  # Direct NDK builds: CMake drives the Android toolchain itself and compiles
  # the libraries only — no Gradle, no APK. The runner image provides the NDK
  # (presets read $env{ANDROID_NDK_HOME}). Cross-compiled, so no test step;
  # on-device coverage is the android_gradle job below.
  android_build:
    name: android_clang_${{ matrix.abi }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        abi: [aarch64, armv7, x86_64, x86]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up build
        uses: ./.github/actions/setup-cmake
        with:
          cache-key: android_clang_${{ matrix.abi }}
      - name: Build
        run: cmake --workflow --preset android_clang_${{ matrix.abi }}_release_build

  # One JDK/Gradle/SDK setup for both the release APK and the emulator run —
  # previously two jobs repeating the same five setup steps.
  android_gradle:
    name: android_gradle_x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up build
        uses: ./.github/actions/setup-cmake
        with:
          cache-key: unused
          cache-cpm: "false"
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: temurin
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
      # AGP passes -DCPM_SOURCE_CACHE=~/.cache/cpm-cmake (see app/build.gradle),
      # which overrides the workflow-level env var — cache that directory.
      - name: Cache CPM sources
        uses: actions/cache@v6
        with:
          path: ~/.cache/cpm-cmake
          key: cpm-android_gradle-${{ hashFiles('cmake/ct_cpm.cmake', 'cmake/cpm/*.cmake') }}
          restore-keys: cpm-android_gradle-
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4ci.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build release APK
        working-directory: ${{ env.ANDROID_PROJECT_DIR }}
        run: ./gradlew --stacktrace :app:assembleRelease
      - name: Run instrumented tests
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          script: cd ${{ env.ANDROID_PROJECT_DIR }} && ./gradlew --stacktrace :app:connectedDebugAndroidTest --info
      # Diagnostics for the upload below: when the test step fails before AGP
      # writes reports (build error, emulator boot failure) the upload errors
      # with a bare "no files found" — this step shows what actually exists.
      - name: Locate test reports
        if: always()
        shell: bash
        run: |
          build_dir="${{ env.ANDROID_PROJECT_DIR }}/app/build"
          for dir in outputs/androidTest-results reports/androidTests; do
            path="${build_dir}/${dir}"
            if [ -d "${path}" ]; then
              echo "== ${dir} =="
              find "${path}" -type f | sort
            else
              echo "::warning::${dir} not found under app/build"
            fi
          done
      # Strict on purpose: a completed test run must produce reports. If this
      # errors, the step above shows where AGP actually wrote them.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android_emulator_x86_64_test_results
          path: |
            ${{ env.ANDROID_PROJECT_DIR }}/app/build/outputs/androidTest-results/
            ${{ env.ANDROID_PROJECT_DIR }}/app/build/reports/androidTests/
          if-no-files-found: error
          compression-level: 0
      - name: Stage and upload release assets
        uses: ./.github/actions/stage-and-upload
        with:
          build-dir: android_project/app/build/outputs/apk/release
          artifact-name: release-assets-android_gradle_x86_64
