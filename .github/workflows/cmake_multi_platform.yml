# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: cmake_multi_platform

on:
    push:
        branches: [main]
        paths: &paths
            - "src/**"
            - "include/**"
            - "cmake/**"
            - "android_project/**"
            - "**/*.cmake"
            - "**/*.cpp"
            - "**/*.hpp"
            - "**/*.c"
            - "**/*.h"
            - "**/*.cxx"
            - "**/*.hxx"
            - "**/CMakeLists.txt"
            - "CMakePresets.json"
            - ".github/workflows/cmake_multi_platform.yml"
    pull_request:
        branches: [main]
        paths: *paths
    release:
        types: [published]
    workflow_dispatch:
    workflow_call:

concurrency:
    group: cmake_multi_platform-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

env:
    CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm_cache

jobs:
    native:
        name: ${{ matrix.preset }}
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-latest
                      preset: linux_clang_x86_64_release
                    - os: ubuntu-latest
                      preset: linux_gcc_x86_64_release
                    - os: windows-2022
                      preset: windows_msvc_x86_64_release
        steps:
            - name: checkout
              uses: actions/checkout@v7
            - name: setup_cmake_and_ninja
              uses: lukka/get-cmake@v4.4.2
            - name: install_linux_system_dependencies
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update -qq
                  sudo apt-get install -y --no-install-recommends \
                    clang doxygen graphviz \
                    libwayland-dev libxkbcommon-dev \
                    libegl1-mesa-dev libgles2-mesa-dev libgl1-mesa-dev \
                    libdbus-1-dev libudev-dev libasound2-dev
            - name: cache_cpm_sources
              uses: actions/cache@v6
              with:
                  path: .cpm_cache
                  key: cpm-${{ matrix.preset }}-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}
                  restore-keys: cpm-${{ matrix.preset }}-
            - name: build
              run: cmake --workflow --preset ${{ matrix.preset }}
            - name: build_documentation
              if: matrix.preset == 'linux_clang_x86_64_release'
              run: cmake --build --preset linux_clang_x86_64_docs
            - name: upload_documentation_artifact
              if: matrix.preset == 'linux_clang_x86_64_release'
              uses: actions/upload-artifact@v7
              with:
                  name: linux_clang_x86_64_doxygen_html
                  path: build/linux_clang_x86_64/generated_docs/html/
                  retention-days: 30
                  if-no-files-found: error
            - name: upload_packages
              uses: actions/upload-artifact@v7
              with:
                  name: ${{ matrix.preset }}
                  path: |
                      build/**/*.zip
                      build/**/*.tar.gz
                  if-no-files-found: ignore
                  compression-level: 0

    cross_windows:
        name: ${{ matrix.preset }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                preset:
                    - windows_llvm_mingw_x86_64_release
                    - windows_llvm_mingw_i686_release
                    - windows_llvm_mingw_aarch64_release
        steps:
            - name: checkout
              uses: actions/checkout@v7
            - name: setup_cmake_and_ninja
              uses: lukka/get-cmake@v4.4.2
            - name: cache_llvm_mingw_toolchain
              uses: actions/cache@v6
              with:
                  path: llvm_mingw
                  key: llvm_mingw-${{ hashFiles('cmake/toolchains/llvm_mingw.cmake') }}
            - name: cache_cpm_sources
              uses: actions/cache@v6
              with:
                  path: .cpm_cache
                  key: cpm-${{ matrix.preset }}-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}
                  restore-keys: cpm-${{ matrix.preset }}-
            - name: build
              run: cmake --workflow --preset ${{ matrix.preset }}
            - name: upload_package
              uses: actions/upload-artifact@v7
              with:
                  name: ${{ matrix.preset }}
                  path: build/**/*.tar.xz
                  if-no-files-found: ignore
                  compression-level: 0

    web:
        name: wasm_emscripten_wasm32_release
        runs-on: ubuntu-latest
        steps:
            - name: checkout
              uses: actions/checkout@v7
            - name: setup_cmake_and_ninja
              uses: lukka/get-cmake@v4.4.2
            - name: cache_emsdk
              uses: actions/cache@v6
              with:
                  path: .emsdk
                  key: emsdk-${{ hashFiles('cmake/toolchains/emscripten.cmake') }}
            - name: cache_cpm_sources
              uses: actions/cache@v6
              with:
                  path: .cpm_cache
                  key: cpm-wasm_emscripten_wasm32-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}
                  restore-keys: cpm-wasm_emscripten_wasm32-
            - name: build_and_test
              run: cmake --workflow --preset wasm_emscripten_wasm32_release
            - name: upload_web_bundle
              uses: actions/upload-artifact@v7
              with:
                  name: wasm_emscripten_wasm32_release
                  path: |
                      build/wasm_emscripten_wasm32/**/05_webassembly.html
                      build/wasm_emscripten_wasm32/**/05_webassembly.js
                      build/wasm_emscripten_wasm32/**/05_webassembly.wasm
                  if-no-files-found: error
                  compression-level: 0

    build_apk:
        name: android_gradle_arm64_v8a_release_apk
        runs-on: ubuntu-latest
        env:
            ANDROID_PROJECT_DIR: ${{ github.workspace }}/android_project
            GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true
        steps:
            - name: checkout
              uses: actions/checkout@v7
            - name: setup_cmake
              uses: lukka/get-cmake@v4.4.2
            - name: setup_jdk_21
              uses: actions/setup-java@v5
              with:
                  java-version: "21"
                  distribution: temurin
            - name: setup_gradle
              uses: gradle/actions/setup-gradle@v6.3.0
            - name: cache_cpm_sources
              uses: actions/cache@v6
              with:
                  path: .cpm_cache
                  key: cpm-android-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}
                  restore-keys: cpm-android-
            - name: build_apk
              working-directory: ${{ env.ANDROID_PROJECT_DIR }}
              run: gradle --stacktrace :app:assembleRelease
            - name: upload_apk
              uses: actions/upload-artifact@v7
              with:
                  name: android_gradle_release_apk
                  path: ${{ env.ANDROID_PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
                  if-no-files-found: error
                  compression-level: 0

    android_test:
        name: android_gradle_x86_64_api_30_instrumented_tests
        runs-on: ubuntu-latest
        env:
            ANDROID_PROJECT_DIR: ${{ github.workspace }}/android_project
            GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true
        steps:
            - name: checkout
              uses: actions/checkout@v7
            - name: setup_cmake
              uses: lukka/get-cmake@v4.4.2
            - name: setup_jdk_21
              uses: actions/setup-java@v5
              with:
                  java-version: "21"
                  distribution: temurin
            - name: setup_gradle
              uses: gradle/actions/setup-gradle@v6.3.0
            - name: enable_kvm
              run: |
                  echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4ci.rules
                  sudo udevadm control --reload-rules
                  sudo udevadm trigger --name-match=kvm
            - name: run_instrumented_tests
              uses: ReactiveCircus/android-emulator-runner@v2
              with:
                  api-level: 30
                  arch: x86_64
                  target: default
                  disable-animations: true
                  script: cd ${{ env.ANDROID_PROJECT_DIR }} && gradle --stacktrace :app:connectedDebugAndroidTest --info
            - name: upload_test_results
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: android_gradle_x86_64_api_30_test_results
                  path: |
                      ${{ env.ANDROID_PROJECT_DIR }}/app/build/outputs/androidTest-results/
                      ${{ env.ANDROID_PROJECT_DIR }}/app/build/reports/androidTests/
                  if-no-files-found: error
                  compression-level: 0
