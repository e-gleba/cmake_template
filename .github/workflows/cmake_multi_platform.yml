# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: cmake_ci

on:
  push:
    branches: [main]
    paths: &cmake_paths
      - "src/**"
      - "tests/**"
      - "tools/**"
      - "scripts/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - ".clang-format"
      - ".clang-tidy"
      - ".cmake-format.yaml"
      - ".pre-commit-config.yaml"
      - ".github/workflows/cmake_multi_platform.yml"
      - "android_project/**"
      - "**/*.cmake"
      - "**/CMakeLists.txt"
      - "**/*.c"
      - "**/*.cc"
      - "**/*.cpp"
      - "**/*.cxx"
      - "**/*.h"
      - "**/*.hh"
      - "**/*.hpp"
      - "**/*.hxx"
  pull_request:
    branches: [main]
    paths: *cmake_paths
  release:
    types: [published]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: cmake_ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm_cache
  ANDROID_PROJECT_DIR: ${{ github.workspace }}/android_project
  GRADLE_OPTS: >-
    -Dorg.gradle.daemon=false
    -Dorg.gradle.parallel=true
    -Dorg.gradle.configureondemand=true

jobs:
  native_build:
    name: ${{ matrix.platform }}_${{ matrix.compiler }}_${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            compiler: clang
            arch: x86_64
            preset: linux_clang_x86_64_release_package
            artifact_name: linux_clang_x86_64
          - os: ubuntu-latest
            platform: linux
            compiler: gcc
            arch: x86_64
            preset: linux_gcc_x86_64_release_package
            artifact_name: linux_gcc_x86_64
          - os: windows-2022
            platform: windows
            compiler: msvc
            arch: x86_64
            preset: windows_msvc_x86_64_release_package
            artifact_name: windows_msvc_x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up CMake and Ninja
        uses: lukka/get-cmake@v4.4.2
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            clang doxygen graphviz \
            libwayland-dev libxkbcommon-dev \
            libegl1-mesa-dev libgles2-mesa-dev libgl1-mesa-dev \
            libdbus-1-dev libudev-dev libasound2-dev
      - name: Cache CPM sources
        uses: actions/cache@v6
        with:
          path: .cpm_cache
          key: cpm-${{ matrix.artifact_name }}-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}
          restore-keys: cpm-${{ matrix.artifact_name }}-
      - name: Build and test
        run: cmake --workflow --preset ${{ matrix.preset }}
      - name: Build documentation
        if: matrix.compiler == 'clang'
        run: cmake --build --preset linux_clang_x86_64_docs
      - name: Verify documentation
        if: matrix.compiler == 'clang'
        shell: bash
        run: |
          index_path="build/linux_clang_x86_64/generated_docs/html/index.html"
          test -f "${index_path}" || { echo "::error::Documentation index not found at ${index_path}"; exit 1; }
      - name: Upload documentation
        if: matrix.compiler == 'clang'
        uses: actions/upload-artifact@v7
        with:
          name: doxygen_html_${{ github.run_id }}
          path: build/linux_clang_x86_64/generated_docs/html/
          retention-days: 30
          if-no-files-found: error
      - name: Stage release assets
        shell: bash
        env:
          BUILD_DIR: build/${{ matrix.artifact_name }}
        run: |
          cmake \
            -DBUILD_DIR="${BUILD_DIR}" \
            -DSTAGING_DIR="${RUNNER_TEMP}/release-assets" \
            -P cmake/scripts/stage_release_assets.cmake
      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-${{ matrix.artifact_name }}
          path: ${{ runner.temp }}/release-assets/
          if-no-files-found: error
          compression-level: 0

  windows_cross_build:
    name: linux_${{ matrix.compiler }}_${{ matrix.arch }}_to_windows
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: llvm_mingw
            arch: x86_64
            preset: windows_llvm_mingw_x86_64_release_package
            build_dir: windows_llvm_mingw_x86_64
          - compiler: llvm_mingw
            arch: i686
            preset: windows_llvm_mingw_x86_release_package
            build_dir: windows_llvm_mingw_x86
          - compiler: llvm_mingw
            arch: aarch64
            preset: windows_llvm_mingw_aarch64_release_package
            build_dir: windows_llvm_mingw_aarch64
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up CMake and Ninja
        uses: lukka/get-cmake@v4.4.2
      - name: Cache LLVM MinGW
        uses: actions/cache@v6
        with:
          path: llvm_mingw
          key: llvm_mingw-${{ hashFiles('cmake/toolchains/llvm_mingw.cmake') }}
      - name: Cache CPM sources
        uses: actions/cache@v6
        with:
          path: .cpm_cache
          key: cpm-windows_llvm_mingw_${{ matrix.arch }}-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}
          restore-keys: cpm-windows_llvm_mingw_${{ matrix.arch }}-
      - name: Build and test
        run: cmake --workflow --preset ${{ matrix.preset }}
      - name: Stage release assets
        env:
          BUILD_DIR: build/${{ matrix.build_dir }}
        run: |
          cmake \
            -DBUILD_DIR="${BUILD_DIR}" \
            -DSTAGING_DIR="${RUNNER_TEMP}/release-assets" \
            -P cmake/scripts/stage_release_assets.cmake
      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-windows-llvm-mingw-${{ matrix.arch }}
          path: ${{ runner.temp }}/release-assets/
          if-no-files-found: error
          compression-level: 0

  web_build:
    name: linux_emscripten_wasm32
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up CMake and Ninja
        uses: lukka/get-cmake@v4.4.2
      - name: Cache Emscripten SDK
        uses: actions/cache@v6
        with:
          path: .emsdk
          key: emsdk-${{ hashFiles('cmake/toolchains/emscripten.cmake') }}
      - name: Cache CPM sources
        uses: actions/cache@v6
        with:
          path: .cpm_cache
          key: cpm-web_emscripten_wasm32-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}
          restore-keys: cpm-web_emscripten_wasm32-
      - name: Build and test
        run: cmake --workflow --preset web_emscripten_wasm32_release_test
      - name: Package web application
        shell: bash
        run: |
          mapfile -t web_files < <(find build/web_emscripten_wasm32 -type f \
            \( -name '05_webassembly.html' -o -name '05_webassembly.js' -o -name '05_webassembly.wasm' \) \
            -print | sort)
          if (( ${#web_files[@]} != 3 )); then
            printf '::error::expected html, JavaScript, and WebAssembly outputs; found %d\n' "${#web_files[@]}"
            exit 1
          fi
          staging_dir="${RUNNER_TEMP}/release-assets"
          mkdir -p "${staging_dir}"
          cmake -E tar cf "${staging_dir}/cxx_project-Web_Emscripten_wasm32.zip" \
            --format=zip -- "${web_files[@]}"
      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-web-emscripten-wasm32
          path: ${{ runner.temp }}/release-assets/
          if-no-files-found: error
          compression-level: 0

  # Direct NDK builds: CMake drives the Android toolchain itself and compiles
  # the libraries only — no Gradle, no APK. The runner image provides the NDK
  # (presets read $env{ANDROID_NDK_HOME}). Cross-compiled, so no test step;
  # on-device coverage is the android_instrumented_test job below.
  android_build:
    name: android_clang_${{ matrix.abi }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [aarch64, armv7, x86_64, x86]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up CMake and Ninja
        uses: lukka/get-cmake@v4.4.2
      - name: Cache CPM sources
        uses: actions/cache@v6
        with:
          path: .cpm_cache
          key: cpm-android_clang_${{ matrix.abi }}-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}
          restore-keys: cpm-android_clang_${{ matrix.abi }}-
      - name: Build
        run: cmake --workflow --preset android_clang_${{ matrix.abi }}_release_build

  android_apk:
    name: android_gradle_x86_64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up CMake
        uses: lukka/get-cmake@v4.4.2
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: "https://gradle.com/terms-of-service"
          build-scan-terms-of-use-agree: "yes"
      # AGP passes -DCPM_SOURCE_CACHE=~/.cache/cpm-cmake (see app/build.gradle),
      # which overrides the workflow-level env var — cache that directory.
      - name: Cache CPM sources
        uses: actions/cache@v6
        with:
          path: ~/.cache/cpm-cmake
          key: cpm-android_gradle-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}
          restore-keys: cpm-android_gradle-
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      - name: Build release APK
        working-directory: ${{ env.ANDROID_PROJECT_DIR }}
        run: ./gradlew --stacktrace :app:assembleRelease
      - name: Stage release assets
        env:
          BUILD_DIR: android_project/app/build/outputs/apk/release
        run: |
          cmake \
            -DBUILD_DIR="${BUILD_DIR}" \
            -DSTAGING_DIR="${RUNNER_TEMP}/release-assets" \
            -P cmake/scripts/stage_release_assets.cmake
      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-android_gradle_x86_64
          path: ${{ runner.temp }}/release-assets/
          if-no-files-found: error
          compression-level: 0

  android_instrumented_test:
    name: android_emulator_x86_64
    runs-on: ubuntu-latest
    # Slow and less hermetic than plain builds — skip when release.yml reuses
    # this workflow so a flaky emulator cannot block a release.
    if: github.event_name != 'workflow_call'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up CMake
        uses: lukka/get-cmake@v4.4.2
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: "https://gradle.com/terms-of-service"
          build-scan-terms-of-use-agree: "yes"
      - name: Cache CPM sources
        uses: actions/cache@v6
        with:
          path: ~/.cache/cpm-cmake
          key: cpm-android_gradle-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}
          restore-keys: cpm-android_gradle-
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4ci.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run instrumented tests
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          script: cd ${{ env.ANDROID_PROJECT_DIR }} && ./gradlew --stacktrace :app:connectedDebugAndroidTest --info
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android_emulator_x86_64_test_results
          path: |
            ${{ env.ANDROID_PROJECT_DIR }}/app/build/outputs/androidTest-results/
            ${{ env.ANDROID_PROJECT_DIR }}/app/build/reports/androidTests/
          if-no-files-found: error
          compression-level: 0
