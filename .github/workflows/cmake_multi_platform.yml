# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: cmake_ci

# Denylist, not allowlist: a new source extension can no longer silently skip
# CI because nobody added it to a 20-line paths list. Only files that cannot
# change a build, test, or package output are ignored — everything else runs.
on:
  push:
    branches: [main]
    paths-ignore: &ci_ignore
      - "**/*.md"
      - "**/*.rst"
      - "**/*.txt"
      - "docs/**"
      - "assets/**"
      - "**/*.png"
      - "**/*.jpg"
      - "**/*.jpeg"
      - "**/*.svg"
      - "**/*.ico"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/*.md"
      - ".coderabbit.yaml"
      - ".cursor/**"
      - ".editorconfig"
      - ".gitignore"
      - ".gitattributes"
      - "license.md"
      - ".opencode/AGENTS.md"
      - ".opencode/REVIEW.md"
  pull_request:
    branches: [main]
    paths-ignore: *ci_ignore
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      android_emulator_tests:
        description: "Run Android emulator instrumented tests (x86_64, slow)"
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      android_emulator_tests:
        description: "Run Android emulator instrumented tests (x86_64, slow)"
        required: false
        type: boolean
        default: false

# PRs cancel their own stale runs; push and release runs always finish —
# cancelling a release-called build mid-matrix once cost a half-published release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm_cache
  ANDROID_PROJECT_DIR: ${{ github.workspace }}/android_project
  GRADLE_OPTS: >-
    -Dorg.gradle.daemon=false
    -Dorg.gradle.configureondemand=true

# Every job is one checkout plus parallel cmake --workflow runs. Presets own
# their binaryDir (build/<preset>), so parallel jobs never share a build tree.
# Anything beyond configure/build/test/package is a ci_* target from
# cmake/ct_ci.cmake — workflows name a preset and a target, nothing else.
jobs:
  native_build:
    name: ${{ matrix.build }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build: linux_clang_x86_64
          - os: ubuntu-latest
            build: linux_gcc_x86_64
          - os: windows-2022
            build: windows_msvc_x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up build
        uses: ./.github/actions/setup-cmake
        with:
          sdl3: ${{ matrix.os == 'ubuntu-latest' && 'true' || 'false' }}
          apt-packages: ${{ matrix.os == 'ubuntu-latest' && 'clang doxygen graphviz' || '' }}
      - name: Build and test
        run: cmake --workflow --preset ${{ matrix.build }}_release_package
      - name: Build and verify documentation
        if: matrix.build == 'linux_clang_x86_64'
        run: cmake --build --preset linux_clang_x86_64_release --target ci_docs
      - name: Upload documentation
        if: matrix.build == 'linux_clang_x86_64'
        uses: actions/upload-artifact@v7
        with:
          name: doxygen_html_${{ github.run_id }}
          path: build/linux_clang_x86_64/generated_docs/html/
          retention-days: 30
          if-no-files-found: error
      - name: Stage and upload release assets
        uses: ./.github/actions/stage-and-upload
        with:
          build-dir: build/${{ matrix.build }}
          artifact: release-assets-${{ matrix.build }}

  # vcpkg manifest lane: same sources, dependencies from vcpkg.json via
  # the vcpkg toolchain instead of CPM fetch. Runs in parallel with the
  # CPM jobs; binary caching (run-vcpkg) keeps warm runs fast.
  vcpkg_build:
    name: ${{ matrix.build }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build: linux_gcc_x86_64_vcpkg
          - os: windows-2022
            build: windows_msvc_x86_64_vcpkg
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up build
        uses: ./.github/actions/setup-cmake
        with:
          sdl3: ${{ matrix.os == 'ubuntu-latest' && 'true' || 'false' }}
      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
      - name: Build and test
        run: cmake --workflow --preset ${{ matrix.build }}_release_package
      - name: Stage and upload release assets
        uses: ./.github/actions/stage-and-upload
        with:
          build-dir: build/${{ matrix.build }}
          artifact: release-assets-${{ matrix.build }}

  windows_cross_build:
    name: ${{ matrix.build }}_to_windows
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        build:
          - windows_llvm_mingw_x86
          - windows_llvm_mingw_x86_64
          - windows_llvm_mingw_aarch64
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up build
        uses: ./.github/actions/setup-cmake
        with:
          llvm-mingw: "true"
      - name: Build and package
        run: cmake --workflow --preset ${{ matrix.build }}_release_package
      - name: Stage and upload release assets
        uses: ./.github/actions/stage-and-upload
        with:
          build-dir: build/${{ matrix.build }}
          artifact: release-assets-${{ matrix.build }}

  web_build:
    name: web_emscripten_wasm32
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up build
        uses: ./.github/actions/setup-cmake
        with:
          emsdk: "true"
      - name: Build and test
        run: cmake --workflow --preset web_emscripten_wasm32_release_test
      - name: Package web application
        run: cmake --build --preset web_emscripten_wasm32_release --target ci_web
      - name: Stage and upload release assets
        uses: ./.github/actions/stage-and-upload
        with:
          build-dir: build/web_emscripten_wasm32
          artifact: release-assets-web-emscripten-wasm32

  # Direct NDK builds: CMake drives the Android toolchain itself and compiles
  # the libraries only — no Gradle, no APK. The runner image provides the NDK
  # (presets read $env{ANDROID_NDK_HOME}). Cross-compiled, so no test step;
  # on-device coverage is the android_gradle job below.
  android_build:
    name: android_clang_${{ matrix.abi }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        abi: [aarch64, x86_64]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up build
        uses: ./.github/actions/setup-cmake
      - name: Build
        run: cmake --workflow --preset android_clang_${{ matrix.abi }}_release_build

  # Gradle builds on both 64-bit arches sharing one JDK/Gradle/SDK setup.
  # The emulator run (x86_64 only) is release-gated — direct `release`
  # publishes, the release pipeline (workflow_call input), or a manual
  # dispatch with android_emulator_tests=true. Push/PR runs only build the
  # APKs; the emulator is too slow to run on every commit.
  android_gradle:
    name: android_gradle_${{ matrix.arch }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # 64-bit only: 32-bit ABIs (armeabi-v7a, x86) intentionally excluded,
        # mirroring the android_build matrix.
        arch: [x86_64, arm64-v8a]
    # The emulator gate, computed once: composite actions cannot see the
    # matrix context, so steps below read env.EMULATOR_TESTS instead of
    # repeating the condition.
    env:
      EMULATOR_TESTS: ${{ matrix.arch == 'x86_64' && (github.event_name == 'release' || inputs.android_emulator_tests) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up build
        uses: ./.github/actions/setup-cmake
        with:
          cpm-cache: "false"
      - name: Set up Gradle
        uses: ./.github/actions/setup-gradle
        with:
          enable-kvm: ${{ env.EMULATOR_TESTS }}
      - name: Build release APK
        working-directory: ${{ env.ANDROID_PROJECT_DIR }}
        run: ./gradlew :app:assembleRelease
      - name: Run instrumented tests
        if: env.EMULATOR_TESTS == 'true'
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          script: cd ${{ env.ANDROID_PROJECT_DIR }} && ./gradlew :app:connectedDebugAndroidTest --info
      # Diagnostics for the upload below: when the test step fails before AGP
      # writes reports (build error, emulator boot failure) the upload errors
      # with a bare "no files found" — this step shows what actually exists.
      - name: Locate test reports
        if: always() && env.EMULATOR_TESTS == 'true'
        run: cmake -DAPP_BUILD_DIR=${{ env.ANDROID_PROJECT_DIR }}/app/build -P cmake/scripts/list_android_reports.cmake
      # Strict on purpose: a completed test run must produce reports. If this
      # errors, the step above shows where AGP actually wrote them.
      - name: Upload test results
        if: always() && env.EMULATOR_TESTS == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: android_emulator_x86_64_test_results
          path: |
            ${{ env.ANDROID_PROJECT_DIR }}/app/build/outputs/androidTest-results/
            ${{ env.ANDROID_PROJECT_DIR }}/app/build/reports/androidTests/
          if-no-files-found: error
          compression-level: 0
      - name: Stage and upload release assets
        uses: ./.github/actions/stage-and-upload
        with:
          build-dir: android_project/app/build/outputs/apk/release
          artifact: release-assets-android_gradle_${{ matrix.arch }}
