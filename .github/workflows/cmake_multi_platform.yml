# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: cmake_multi_platform

on:
    push:
        branches: [main]
        paths: &paths
            - "src/**"
            - "include/**"
            - "cmake/**"
            - "**/*.cmake"
            - "**/*.cpp"
            - "**/*.hpp"
            - "**/*.c"
            - "**/*.h"
            - "**/*.cxx"
            - "**/*.hxx"
            - "**/CMakeLists.txt"
            - "CMakePresets.json"
            - ".github/workflows/cmake_multi_platform.yml"
    pull_request:
        branches: [main]
        paths: *paths
    release:
        types: [published]
    workflow_dispatch:
    # Called by release.yml — same matrix, no duplicated jobs.
    workflow_call:

# github.workflow is the *caller* name when this file is reused.
# Prefix with this file's identity so a release call cannot share
# a concurrency group with release.yml itself.
concurrency:
    group: cmake_multi_platform-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

env:
    CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm_cache

jobs:
    native:
        name: native_${{ matrix.artifact_name }}
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-latest
                      preset: clang-full
                      artifact_name: linux_clang
                    - os: ubuntu-latest
                      preset: gcc-full
                      artifact_name: linux_gcc
                    - os: windows-2022
                      preset: msvc-full
                      artifact_name: windows_msvc
        steps:
            - name: checkout
              uses: actions/checkout@v7
            - name: setup_cmake_and_ninja
              uses: lukka/get-cmake@v4.4.2
            - name: install_linux_system_dependencies
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update -qq
                  sudo apt-get install -y --no-install-recommends \
                    clang doxygen graphviz \
                    libwayland-dev libxkbcommon-dev \
                    libegl1-mesa-dev libgles2-mesa-dev libgl1-mesa-dev \
                    libdbus-1-dev libudev-dev libasound2-dev
            - name: cache_cpm_sources
              uses: actions/cache@v6
              with:
                  path: .cpm_cache
                  key: cpm-${{ matrix.artifact_name }}-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}
                  restore-keys: cpm-${{ matrix.artifact_name }}-
            - name: build
              run: cmake --workflow --preset ${{ matrix.preset }}
            - name: build_documentation
              if: matrix.preset == 'clang-full'
              run: cmake --build --preset clang-docs
            - name: verify_documentation
              if: matrix.preset == 'clang-full'
              shell: bash
              run: |
                  index_path="build/clang/generated_docs/html/index.html"
                  if [[ ! -f "${index_path}" ]]; then
                    echo "::error::Documentation index not found at ${index_path}"
                    exit 1
                  fi
            - name: upload_documentation_artifact
              if: matrix.preset == 'clang-full'
              uses: actions/upload-artifact@v7
              with:
                  name: doxygen_html_${{ github.run_id }}
                  path: build/clang/generated_docs/html/
                  retention-days: 30
                  if-no-files-found: error
            - name: upload_zip_artifact
              uses: actions/upload-artifact@v7
              with:
                  name: ${{ matrix.artifact_name }}_zip
                  path: build/**/*.zip
                  if-no-files-found: ignore
                  compression-level: 0
            - name: upload_tgz_artifact
              uses: actions/upload-artifact@v7
              with:
                  name: ${{ matrix.artifact_name }}_tgz
                  path: build/**/*.tar.gz
                  if-no-files-found: ignore
                  compression-level: 0

    cross_windows:
        name: cross_windows_${{ matrix.artifact_name }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - preset: llvm-mingw-x86_64-full
                      artifact_name: windows_mingw_x86_64
                    - preset: llvm-mingw-i686-full
                      artifact_name: windows_mingw_i686
                    - preset: llvm-mingw-aarch64-full
                      artifact_name: windows_mingw_aarch64
        steps:
            - name: checkout
              uses: actions/checkout@v7
            - name: setup_cmake_and_ninja
              uses: lukka/get-cmake@v4.4.2
            - name: cache_llvm_mingw_toolchain
              uses: actions/cache@v6
              with:
                  path: llvm_mingw
                  key: llvm_mingw-${{ hashFiles('cmake/toolchains/llvm_mingw.cmake') }}
            - name: cache_cpm_sources
              uses: actions/cache@v6
              with:
                  path: .cpm_cache
                  key: cpm-${{ matrix.artifact_name }}-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}
                  restore-keys: cpm-${{ matrix.artifact_name }}-
            - name: build
              run: cmake --workflow --preset ${{ matrix.preset }}
            - name: upload_txz_artifact
              uses: actions/upload-artifact@v7
              with:
                  name: ${{ matrix.artifact_name }}_txz
                  path: build/**/*.tar.xz
                  if-no-files-found: ignore
                  compression-level: 0

    web:
        name: web_emscripten
        runs-on: ubuntu-latest
        steps:
            - name: checkout
              uses: actions/checkout@v7
            - name: setup_cmake_and_ninja
              uses: lukka/get-cmake@v4.4.2
            - name: cache_emsdk
              uses: actions/cache@v6
              with:
                  path: .emsdk
                  key: emsdk-${{ hashFiles('cmake/toolchains/emscripten.cmake') }}
            - name: cache_cpm_sources
              uses: actions/cache@v6
              with:
                  path: .cpm_cache
                  key: cpm-web-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}
                  restore-keys: cpm-web-
            - name: build_and_test
              run: cmake --workflow --preset emscripten-full
            - name: upload_web_bundle
              uses: actions/upload-artifact@v7
              with:
                  name: web_emscripten_bundle
                  path: |
                      build/emscripten/**/05_webassembly.html
                      build/emscripten/**/05_webassembly.js
                      build/emscripten/**/05_webassembly.wasm
                  if-no-files-found: error
                  compression-level: 0
