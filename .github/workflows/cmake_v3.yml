# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: cmake_v3_ci

# x86-64-v3 (AVX2) packages: same sources, -march=x86-64-v3 + LTO. A separate
# callable workflow on purpose: it runs only when release.yml calls it, so PR
# and push runs never show a skipped job row (skipped jobs render their
# matrix name literally — a GitHub display quirk, not fixable in-file).
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm_cache

jobs:
  native_v3_build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux_clang_x86_64_v3
            os: ubuntu-latest
            preset: linux_clang_x86_64_v3_release_package
            artifact_name: linux_clang_x86_64_v3
            sdl3_deps: "true"
            apt: "clang doxygen graphviz"
          - name: linux_gcc_x86_64_v3
            os: ubuntu-latest
            preset: linux_gcc_x86_64_v3_release_package
            artifact_name: linux_gcc_x86_64_v3
            sdl3_deps: "true"
            apt: "clang doxygen graphviz"
          - name: windows_msvc_x86_64_v3
            os: windows-2022
            preset: windows_msvc_x86_64_v3_release_package
            artifact_name: windows_msvc_x86_64_v3
            sdl3_deps: "false"
            apt: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up build
        uses: ./.github/actions/setup-cmake
        with:
          cache-key: ${{ matrix.artifact_name }}
          sdl3-deps: ${{ matrix.sdl3_deps }}
          apt-packages: ${{ matrix.apt }}
      - name: Build and test
        run: cmake --workflow --preset ${{ matrix.preset }}
      - name: Stage and upload release assets
        uses: ./.github/actions/stage-and-upload
        with:
          build-dir: build/${{ matrix.artifact_name }}
          artifact-name: release-assets-${{ matrix.artifact_name }}
