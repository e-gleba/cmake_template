# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: docker_ci

on:
  pull_request:
    paths: &docker_paths
      - "docker/**"
      - ".github/workflows/docker.yml"
  push:
    branches: [main]
    paths: *docker_paths
  workflow_dispatch:

concurrency:
  group: docker_ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect_changes:
    name: docker_detect_changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.changes.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect changed Dockerfiles
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          files=(fedora manjaro steamos cachyos alt)
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            changed=("${files[@]}")
          else
            mapfile -t diff < <(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}")
            changed=()
            for name in "${files[@]}"; do
              if printf '%s\n' "${diff[@]}" | grep -qx "docker/${name}.Dockerfile"; then
                changed+=("${name}")
              fi
            done
            if printf '%s\n' "${diff[@]}" | grep -qx '.github/workflows/docker.yml'; then
              changed=("${files[@]}")
            fi
          fi
          matrix=$(printf '%s\n' "${changed[@]}" | jq -R . | jq -sc .)
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"

  docker_build_and_lint:
    name: linux_docker_${{ matrix.name }}
    needs: detect_changes
    if: needs.detect_changes.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJSON(needs.detect_changes.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Lint Dockerfile
        run: docker run --rm -i hadolint/hadolint:v2.15.1 < "docker/${{ matrix.name }}.Dockerfile"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: docker
          file: docker/${{ matrix.name }}.Dockerfile
          load: true
          tags: cmake-template:${{ matrix.name }}
          build-args: SOURCE=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=docker-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.name }}
      - name: Verify toolchain
        env:
          IMAGE: cmake-template:${{ matrix.name }}
          TOOLCHAIN: ${{ matrix.name }}
        run: |
          build_tool="ninja --version"
          [[ "${TOOLCHAIN}" == "alt" ]] && build_tool="make --version"
          docker run --rm --entrypoint sh "${IMAGE}" -c "
            cmake --version &&
            git --version &&
            c++ --version &&
            clang++ --version &&
            ${build_tool}
          "
