# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: workflow_lint

on:
  pull_request:
    paths: &workflow_paths
      - ".github/**"
  push:
    branches: [main]
    paths: *workflow_paths
  workflow_dispatch:

concurrency:
  group: workflow_lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Lint workflows
        uses: raven-actions/actionlint@v2

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Audit workflow security
        uses: zizmorcore/zizmor-action@v0.3.2
