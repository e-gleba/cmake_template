# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: lint

on:
  pull_request:
    paths: &paths
      - ".github/workflows/**"
  push:
    branches: [main]
    paths: *paths
  workflow_dispatch:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: lint_workflows
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo:ro" \
            -w /repo \
            rhysd/actionlint:1.7.12 \
            -color
