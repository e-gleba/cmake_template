# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
#
# Publish toolchain images to GHCR.
#
# Adapt: add a row to jobs.publish.strategy.matrix.include.
#   name — image suffix (ghcr.io/<owner>/<repo>/<name>)
#   file — Dockerfile path, relative to the repo root
# Image names, tags, and labels come from github.repository + docker/metadata-action.
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: publish-docker

on:
  workflow_call:
    inputs:
      tag:
        description: Extra image tag (in addition to latest / sha)
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      tag:
        description: Extra image tag (in addition to latest / sha)
        required: false
        type: string
        default: ""
  push:
    branches: [main]
    paths:
      - "docker/**"
      - ".github/workflows/publish-docker.yml"

concurrency:
  group: publish-docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io
  # Empty on push; set on dispatch / reusable call.
  EXTRA_TAG: ${{ inputs.tag || '' }}

jobs:
  publish:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fedora
            file: docker/fedora.Dockerfile
          - name: manjaro
            file: docker/manjaro.Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ env.EXTRA_TAG }},enable=${{ env.EXTRA_TAG != '' }}
            type=sha,prefix=sha-
            type=ref,event=branch

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: docker
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Summary
        if: always()
        run: |
          {
            echo "## ${{ matrix.name }}"
            echo "- Status: \`${{ job.status }}\`"
            echo "- Image: \`${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.name }}\`"
            echo "- Tags: \`${{ steps.meta.outputs.tags }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
