# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: docker_publish

on:
  workflow_call:
    inputs:
      tag:
        description: Extra image tag
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      tag:
        description: Extra image tag
        required: false
        type: string
        default: ""
  push:
    branches: [main]
    paths:
      - "docker/**"
      - ".github/workflows/publish-docker.yml"

concurrency:
  group: docker_publish-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  REGISTRY: ghcr.io
  EXTRA_TAG: ${{ inputs.tag || '' }}

jobs:
  docker_publish:
    name: linux_docker_${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        name: [fedora, manjaro, steamos, cachyos, alt]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ env.EXTRA_TAG }},enable=${{ env.EXTRA_TAG != '' }}
            type=sha,prefix=sha-
            type=ref,event=branch
      - name: Build and push image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: docker
          file: docker/${{ matrix.name }}.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          build-args: SOURCE=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Attest image provenance and SBOM
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          sbom: true
