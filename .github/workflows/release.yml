# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (for example, v1.0.0)"
        required: true
        type: string
      next_version:
        description: "Next development version (for example, 1.0.1)"
        required: true
        type: string
      prerelease:
        description: "Mark as prerelease"
        required: false
        type: boolean
        default: false
      publish_docker:
        description: "Publish toolchain images to GHCR"
        required: false
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  docker:
    name: docker
    if: ${{ inputs.publish_docker }}
    uses: ./.github/workflows/publish-docker.yml
    with:
      tag: ${{ inputs.version }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

  packages:
    name: packages
    uses: ./.github/workflows/cmake_multi_platform.yml
    permissions:
      contents: read

  publish:
    name: github release
    needs: [docker, packages]
    if: >-
      !cancelled()
      && needs.packages.result == 'success'
      && (needs.docker.result == 'success' || needs.docker.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ inputs.version }}
    steps:
      - name: Validate release tag
        run: |
          if [[ ! "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::version must look like v1.2.3 or v1.2.3-rc.1 (got '${VERSION}')"
            exit 1
          fi
          if gh release view "${VERSION}" >/dev/null 2>&1; then
            echo "::error::release ${VERSION} already exists"
            exit 1
          fi

      - name: Download package artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
          pattern: "*_package"
          merge-multiple: true

      - name: Verify release assets
        run: |
          find artifacts -type f \( -name "*.zip" -o -name "*.tar.gz" -o -name "*.tar.xz" \) -print0 | sort -z > /tmp/release-assets
          mapfile -d "" files < /tmp/release-assets
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::no release packages found"
            exit 1
          fi
          {
            echo "## Release assets"
            echo
            for file in "${files[@]}"; do
              echo "- ${file}"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attest release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            artifacts/*.zip
            artifacts/*.tar.gz
            artifacts/*.tar.xz

      - name: Create GitHub release
        env:
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          mapfile -d "" files < /tmp/release-assets
          args=(
            "${VERSION}"
            --target "${{ github.sha }}"
            --title "${VERSION}"
            --generate-notes
          )
          if [ "${PRERELEASE}" = "true" ]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}" "${files[@]}"
          echo "Released [${VERSION}](${{ github.server_url }}/${{ github.repository }}/releases/tag/${VERSION})" >> "$GITHUB_STEP_SUMMARY"

  bump_version:
    name: open next-version PR
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false

      - name: Validate and bump version
        env:
          NEXT_VERSION: ${{ inputs.next_version }}
        run: |
          if [[ ! "${NEXT_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::next_version must be plain semantic version (got '${NEXT_VERSION}')"
            exit 1
          fi
          current=$(sed -n 's/^[[:space:]]*VERSION[[:space:]]\+\([0-9][0-9.]*\).*/\1/p' CMakeLists.txt | head -n1)
          if [ -z "${current}" ]; then
            echo "::error::project VERSION not found in CMakeLists.txt"
            exit 1
          fi
          if [ "$(printf '%s\n%s\n' "${current}" "${NEXT_VERSION}" | sort -V | tail -n1)" != "${NEXT_VERSION}" ] || [ "${current}" = "${NEXT_VERSION}" ]; then
            echo "::error::next_version (${NEXT_VERSION}) must be greater than current version (${current})"
            exit 1
          fi
          sed -i -E "s/^([[:space:]]*VERSION[[:space:]]+)[0-9]+\.[0-9]+\.[0-9]+/\1${NEXT_VERSION}/" CMakeLists.txt

      - name: Open next-version PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: automation/next-version
          delete-branch: true
          commit-message: "chore: start ${{ inputs.next_version }} development"
          title: "chore: start ${{ inputs.next_version }} development"
          body: |
            Automated post-release version bump after `${{ inputs.version }}`.

            Merge after required checks pass.
          labels: |
            automated
            release
