# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
#
# One-click GitHub Release: validate inputs → build all platforms →
# tag + release with assets → PR bumping project() VERSION on main.
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (e.g. v1.2.3 or v1.2.3-rc.1)"
        required: true
        type: string
      next_version:
        description: "Post-release CMake project() VERSION, no v prefix (e.g. 1.2.4)"
        required: true
        type: string
      prerelease:
        description: "Mark as pre-release"
        required: false
        type: boolean
        default: false
      publish_docker:
        description: "Build and push toolchain images to GHCR"
        required: false
        type: boolean
        default: true
      automerge:
        description: "Auto-merge the post-release version-bump PR"
        required: false
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Inputs reach the shell via env vars only — inline ${{ inputs.* }}
      # expansion inside run: blocks is a script-injection vector.
      - name: Validate inputs
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IN_VERSION: ${{ inputs.version }}
          IN_NEXT_VERSION: ${{ inputs.next_version }}
        run: |
          set -euo pipefail

          if [[ ! "${IN_VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::version must look like v1.2.3 or v1.2.3-rc.1 (got '${IN_VERSION}')"
            exit 1
          fi
          if [[ ! "${IN_NEXT_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::next_version must be plain semver without v prefix (e.g. 1.2.4) — got '${IN_NEXT_VERSION}'"
            exit 1
          fi

          # Read-only check: the tag must not exist yet. Nothing is created here.
          if gh api "repos/${{ github.repository }}/git/refs/tags/${IN_VERSION}" >/dev/null 2>&1; then
            echo "::error::tag ${IN_VERSION} already exists"
            exit 1
          fi

          # The released code must carry the released version (core, sans -rc suffix).
          # Script mode (cmake -P): no configure, no network.
          current=$(cmake -Dproject_file=CMakeLists.txt -P cmake/scripts/get_project_version.cmake \
            | sed -n 's/^PROJECT_VERSION=//p')
          core=${IN_VERSION#v}
          core=${core%%-*}
          if [[ "${core}" != "${current}" ]]; then
            echo "::error::release ${IN_VERSION} does not match CMake project version v${current} on main — bump project() VERSION first"
            exit 1
          fi

          # The post-release version must move forward.
          if [[ "${IN_NEXT_VERSION}" == "${core}" ]] || ! printf '%s\n%s\n' "${core}" "${IN_NEXT_VERSION}" | sort -C -V; then
            echo "::error::next_version (${IN_NEXT_VERSION}) must be greater than the released version (${core})"
            exit 1
          fi

  docker:
    name: docker
    needs: validate
    if: ${{ inputs.publish_docker }}
    uses: ./.github/workflows/publish-docker.yml
    with:
      tag: ${{ inputs.version }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

  packages:
    name: packages
    needs: validate
    uses: ./.github/workflows/cmake_multi_platform.yml
    permissions:
      contents: read

  publish:
    name: tag and github release
    needs: [docker, packages]
    if: >-
      !cancelled()
      && needs.packages.result == 'success'
      && (needs.docker.result == 'success' || needs.docker.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ inputs.version }}
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          pattern: release-assets-*
          merge-multiple: true

      - name: Verify release assets
        shell: bash
        run: |
          shopt -s nullglob
          assets=(release-assets/*)
          if (( ${#assets[@]} == 0 )); then
            echo "::error::no release assets were downloaded"
            exit 1
          fi

          {
            echo "## Release assets (${#assets[@]})"
            printf -- '- %s\n' "${assets[@]#release-assets/}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Create GitHub Release
        env:
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          shopt -s nullglob
          assets=(release-assets/*)
          args=(
            "${VERSION}"
            --repo "${{ github.repository }}"
            --target "${{ github.sha }}"
            --title "${VERSION}"
            --generate-notes
          )
          if [ "${PRERELEASE}" = "true" ]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}" "${assets[@]}"
          echo "Created ${{ github.server_url }}/${{ github.repository }}/releases/tag/${VERSION}" \
            >> "$GITHUB_STEP_SUMMARY"

  bump_cmake_version:
    name: bump cmake version via pr
    needs: publish
    if: >-
      !cancelled()
      && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: post-release-cmake-version-bump
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NEXT_VERSION: ${{ inputs.next_version }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main

      # The script rewrites project() VERSION and reads the file back to
      # prove the bump took effect. Script mode (cmake -P): no configure.
      - name: Bump project version
        run: |
          cmake -Dproject_file=CMakeLists.txt -Dversion="${NEXT_VERSION}" \
            -P cmake/scripts/set_project_version.cmake

      - name: Verify bumped project
        run: |
          git diff --check
          git diff --exit-code -- . ':!CMakeLists.txt'

      - name: Create version bump pull request
        id: bump-pr
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: CMakeLists.txt
          commit-message: "chore: bump CMake project version to ${{ inputs.next_version }}"
          committer: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          branch: chore/bump-cmake-version
          delete-branch: true
          base: main
          title: "chore: bump CMake project version to ${{ inputs.next_version }}"
          body: |
            Post-release version bump after `${{ inputs.version }}`.

            - Next project version: `${{ inputs.next_version }}`
            - Changed file: `CMakeLists.txt`

            Generated by the release workflow.

      - name: Enable auto-merge
        if: ${{ inputs.automerge && steps.bump-pr.outputs.pull-request-number != '' }}
        run: |
          if ! gh pr merge "${{ steps.bump-pr.outputs.pull-request-number }}" \
               --repo "${{ github.repository }}" \
               --squash --auto --delete-branch \
               --match-head-commit "${{ steps.bump-pr.outputs.pull-request-head-sha }}"; then
            echo "::warning::could not enable auto-merge (is it allowed in repo settings?) — merge manually: ${{ steps.bump-pr.outputs.pull-request-url }}"
          fi

      - name: Report version bump
        if: steps.bump-pr.outputs.pull-request-url != ''
        run: echo "Opened ${{ steps.bump-pr.outputs.pull-request-url }}" >> "${GITHUB_STEP_SUMMARY}"
