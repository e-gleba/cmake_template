# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (for example, v1.0.0)"
        required: true
        type: string
      prerelease:
        description: "Mark as prerelease"
        required: false
        type: boolean
        default: false
      publish_docker:
        description: "Publish toolchain images to GHCR"
        required: false
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  docker:
    name: docker
    if: ${{ inputs.publish_docker }}
    uses: ./.github/workflows/publish-docker.yml
    with:
      tag: ${{ inputs.version }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

  packages:
    name: packages
    uses: ./.github/workflows/cmake_multi_platform.yml
    permissions:
      contents: read

  publish:
    name: github release
    needs: [docker, packages]
    if: >-
      !cancelled()
      && needs.packages.result == 'success'
      && (needs.docker.result == 'success' || needs.docker.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ inputs.version }}
    steps:
      - name: Validate release tag
        run: |
          if [[ ! "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::version must look like v1.2.3 or v1.2.3-rc.1 (got '${VERSION}')"
            exit 1
          fi
          if gh release view "${VERSION}" >/dev/null 2>&1; then
            echo "::error::release ${VERSION} already exists"
            exit 1
          fi

      - name: Download package artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: "*_package"
          merge-multiple: true

      - name: Verify release assets
        run: |
          find artifacts -type f \( -name "*.zip" -o -name "*.tar.gz" -o -name "*.tar.xz" \) -print0 | sort -z > /tmp/release-assets
          mapfile -d "" files < /tmp/release-assets
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::no release packages found"
            exit 1
          fi
          printf "## Release assets\n\n" >> "$GITHUB_STEP_SUMMARY"
          printf -- "- `%s`\n" "${files[@]}" >> "$GITHUB_STEP_SUMMARY"

      - name: Attest release assets
        uses: actions/attest@v4
        with:
          subject-path: |
            artifacts/*.zip
            artifacts/*.tar.gz
            artifacts/*.tar.xz

      - name: Create GitHub release
        env:
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          mapfile -d "" files < /tmp/release-assets
          args=(
            "${VERSION}"
            --target "${{ github.sha }}"
            --title "${VERSION}"
            --generate-notes
          )
          if [ "${PRERELEASE}" = "true" ]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}" "${files[@]}"
          echo "Released [${VERSION}](${{ github.server_url }}/${{ github.repository }}/releases/tag/${VERSION})" >> "$GITHUB_STEP_SUMMARY"
