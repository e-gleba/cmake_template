# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
#
# Self-hosted Renovate.
#
# Token, in order of preference:
#   1. GitHub App (vars.RENOVATE_APP_ID + secrets.RENOVATE_APP_PRIVATE_KEY)
#   2. secrets.RENOVATE_TOKEN (fine-grained PAT)
#   3. secrets.GITHUB_TOKEN — degraded, see below
#
# GITHUB_TOKEN cannot open pull requests unless
# Settings -> Actions -> General -> Workflow permissions ->
# "Allow GitHub Actions to create and approve pull requests" is enabled; the
# branch push still succeeds, so the repository fills with renovate/* branches
# and a dashboard issue but no PRs. Even with the setting enabled, events from
# GITHUB_TOKEN start no workflow run, so PR checks never appear and
# platformAutomerge waits forever. An App (or PAT) fixes both.
#
# App permissions required: contents RW, pull requests RW, issues RW,
# commit statuses RW (minimumReleaseAge writes renovate/stability-days),
# workflows RW (to update .github/workflows/*), metadata R.
# Repository settings required: "Allow auto-merge".
name: renovate

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run
        required: false
        default: false
        type: boolean
      log_level:
        description: Log level
        required: false
        default: info
        type: choice
        options: [debug, info, warn, error]
  schedule:
    - cron: "0 6 * * 1"
  push:
    branches: [main]
    paths:
      - ".github/renovate.json5"
      - ".github/workflows/renovate.yml"

concurrency:
  group: renovate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  renovate:
    name: linux_renovate_x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      statuses: write
    # secrets.* is not an allowed context in step if expressions — expose the
    # presence check through env instead (actionlint: secrets context rejected).
    env:
      HAS_RENOVATE_APP: ${{ vars.RENOVATE_APP_ID != '' && secrets.RENOVATE_APP_PRIVATE_KEY != '' }}
      HAS_RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN != '' }}
    steps:
      - name: Mint GitHub App token
        id: app_token
        if: env.HAS_RENOVATE_APP == 'true'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-statuses: write
          permission-workflows: write

      - name: Warn about the degraded token
        if: steps.app_token.outputs.token == '' && env.HAS_RENOVATE_TOKEN != 'true'
        run: >-
          echo "::warning::running with GITHUB_TOKEN — Renovate can push
          branches but pull requests need the repository setting 'Allow GitHub
          Actions to create and approve pull requests', and the PRs it opens
          will not trigger CI. Configure the RENOVATE_APP_* app instead."

      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run Renovate
        uses: renovatebot/github-action@v46.3.1
        with:
          configurationFile: .github/renovate.json5
          token: ${{ steps.app_token.outputs.token || secrets.RENOVATE_TOKEN || secrets.GITHUB_TOKEN }}
        env:
          # RENOVATE_DRY_RUN takes extract|lookup|full, never a boolean —
          # "false" is rejected, "null" means "not a dry run".
          RENOVATE_DRY_RUN: ${{ inputs.dry_run && 'full' || 'null' }}
          LOG_LEVEL: ${{ inputs.log_level || 'info' }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_PLATFORM_COMMIT: enabled
          RENOVATE_AUTODISCOVER: "false"
          RENOVATE_ONBOARDING: "false"
