# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: stale

on:
  schedule:
    - cron: "30 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stale:
    name: triage stale discussions
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Mark inactive items
        uses: actions/stale@1e223db275d687790206a7acac4d1a11bd6fe629 # v10
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-issue-stale: 60
          days-before-issue-close: 14
          days-before-pr-stale: 30
          days-before-pr-close: -1
          stale-issue-label: stale
          stale-pr-label: stale
          stale-issue-message: >-
            No activity for 60 days. Add current details or remove the stale label
            to keep this issue open.
          close-issue-message: >-
            Closing after 14 more days without activity. Reopen if this remains relevant.
          stale-pr-message: >-
            No activity for 30 days. This pull request will remain open, but please
            rebase or update its status when work resumes.
