# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: steam_runtime_ci

# Steam / Steam Deck compliance pipeline:
#   1. steamrt4_build          — build + test + package INSIDE Valve's Steam
#      Linux Runtime 4 SDK container, then gate ELF symbol versions
#      (GLIBC/GLIBCXX/CXXABI/GCC) against the runtime's own libraries.
#   2. steamrt4_platform_smoke — validate the produced binaries in the
#      steamrt4 PLATFORM image (the minimal client-identical runtime that
#      ships to Steam Deck and desktop users, also the Proton 11+ base):
#      a loader resolution gate shows which runtime path every NEEDED
#      library is taken from, then the binaries execute for real.
#   3. windows_*_steam         — static-CRT Windows builds; a PE import gate
#      proves no VC++ redistributable / MinGW runtime DLL is required.
#
# All gates are cmake -P scripts under cmake/steampipe/ — one language, no
# shell quoting, locally runnable with the exact same command lines.
on:
  push:
    branches: [main]
    paths: &steam_paths
      - "src/**"
      - "tests/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - ".github/workflows/steam_runtime.yml"
      - "**/*.cmake"
      - "**/CMakeLists.txt"
      - "**/*.c"
      - "**/*.cc"
      - "**/*.cpp"
      - "**/*.cxx"
      - "**/*.h"
      - "**/*.hh"
      - "**/*.hpp"
      - "**/*.hxx"
  pull_request:
    branches: [main]
    paths: *steam_paths
  workflow_dispatch:

concurrency:
  group: steam_runtime_ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm_cache
  # Keep the tag in sync with docker/steamos.Dockerfile.
  STEAMRT4_PLATFORM_IMAGE: registry.gitlab.steamos.cloud/steamrt/steamrt4/platform:4.0.20260805.254769

jobs:
  steamrt4_build:
    name: linux_steamrt4_x86_64_sdk_build
    runs-on: ubuntu-latest
    container:
      # Valve's SDK = compilers + headers constrained to the runtime ABI.
      # --user root: apt and checkout need it (the SDK image defaults to a
      # named unprivileged user).
      image: registry.gitlab.steamos.cloud/steamrt/steamrt4/sdk:4.0.20260805.254769
      options: --user root
    steps:
      # The base SDK image ships neither git nor CA certificates (see
      # docker/steamos.Dockerfile, which installs both) — actions/checkout
      # and lukka/get-cmake need them, so install before anything else.
      - name: Install git and CA certificates
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y --no-install-recommends git ca-certificates
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up CMake and Ninja
        uses: lukka/get-cmake@v4.4.2
      - name: Install SDL3 system dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            libwayland-dev libxkbcommon-dev \
            libegl1-mesa-dev libgles2-mesa-dev libgl1-mesa-dev \
            libdbus-1-dev libudev-dev libasound2-dev
      # Key on the files that define the dependency set — precise
      # invalidation, and a shallow glob: hashFiles('**/...') walks the
      # whole workspace and is unreliable in root-run container jobs once
      # build/ and .cpm_cache/ exist (actions/runner#449).
      - name: Cache CPM sources
        uses: actions/cache@v6
        with:
          path: .cpm_cache
          key: cpm-linux_steamrt4_x86_64-${{ hashFiles('cmake/ct_cpm.cmake', 'cmake/cpm/*.cmake') }}
          restore-keys: cpm-linux_steamrt4_x86_64-
      - name: Show runtime identity
        run: |
          cat /etc/os-release
          gcc --version | head -n 1
          ldd --version | head -n 1
      - name: Build, test, and package inside the steamrt4 SDK
        run: cmake --workflow --preset linux_steamrt4_x86_64_release_package
      - name: ABI gate — symbol versions vs runtime libraries
        run: cmake "-DTARGETS=build/linux_steamrt4_x86_64/src;build/linux_steamrt4_x86_64/tests;build/linux_steamrt4_x86_64/_deps/sdl3-build" -P cmake/steampipe/check_elf_abi.cmake
      # Stage what the platform smoke test needs: the shipped executables
      # plus libSDL3 (cp -L collapses the .so symlink chain — artifacts do
      # not preserve symlinks).
      - name: Stage binaries for the platform smoke test
        run: |
          b=build/linux_steamrt4_x86_64
          s=${RUNNER_TEMP}/steam_binaries
          mkdir -p "${s}/bin" "${s}/lib"
          cp "${b}/src/01_hello_world/Release/01_hello_world" "${s}/bin/"
          cp "${b}/src/02_sdl3_app/Release/02_sdl3_app" "${s}/bin/"
          cp "${b}/tests/Release/tests" "${s}/bin/"
          sdl_soname=$(find "${b}/_deps/sdl3-build" -name 'libSDL3.so.0' -print -quit)
          test -n "${sdl_soname}" || { echo "::error::libSDL3.so.0 not found under ${b}/_deps/sdl3-build"; exit 1; }
          cp -L "${sdl_soname}" "${s}/lib/libSDL3.so.0"
      - name: Upload binaries for the platform smoke test
        uses: actions/upload-artifact@v7
        with:
          name: steamrt4-binaries-${{ github.run_id }}
          path: ${{ runner.temp }}/steam_binaries/
          if-no-files-found: error
      - name: Stage release assets
        run: |
          cmake \
            -DBUILD_DIR="build/linux_steamrt4_x86_64" \
            -DSTAGING_DIR="${RUNNER_TEMP}/release-assets" \
            -P cmake/scripts/stage_release_assets.cmake
      - name: Upload SteamPipe-ready depot archive
        uses: actions/upload-artifact@v7
        with:
          name: steam-depot-linux_steamrt4_x86_64
          path: ${{ runner.temp }}/release-assets/
          if-no-files-found: error
          compression-level: 0

  steamrt4_platform_smoke:
    name: linux_steamrt4_x86_64_platform_smoke
    needs: steamrt4_build
    runs-on: ubuntu-latest
    steps:
      # The loader gate is a cmake -P script from this repo — checkout first.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Pin the same CMake the other jobs use; the gate needs 3.20+
      # (cmake_path) and runner images drift.
      - name: Set up CMake
        uses: lukka/get-cmake@v4.4.2
      - name: Download SDK-built binaries
        uses: actions/download-artifact@v7
        with:
          name: steamrt4-binaries-${{ github.run_id }}
          path: steam_binaries
      - name: Restore executable bits
        run: chmod -R +x steam_binaries
      # The platform image is the minimal runtime that ships to users — no
      # shell, no build tools, so the dynamic loader itself is the gate:
      # --list prints which runtime path every NEEDED library is taken
      # from, and any "not found" fails the job. LD_LIBRARY_PATH provides
      # the staged libSDL3 (the build-tree RPATH is meaningless here).
      # 02_sdl3_app needs a display to execute but only the loader to
      # validate — this gate covers it.
      - name: Library resolution gate on the real runtime
        run: cmake "-DROOT=${{ github.workspace }}/steam_binaries" -P cmake/steampipe/check_steamrt_loader.cmake
      - name: Smoke test — hello world on the real runtime
        run: >-
          docker run --rm --entrypoint ""
          -e LD_DEBUG=libs
          -v "${{ github.workspace }}/steam_binaries:/opt/app:ro"
          "$STEAMRT4_PLATFORM_IMAGE"
          /opt/app/bin/01_hello_world
      - name: Smoke test — full test suite on the real runtime
        run: >-
          docker run --rm --entrypoint ""
          -v "${{ github.workspace }}/steam_binaries:/opt/app:ro"
          "$STEAMRT4_PLATFORM_IMAGE"
          /opt/app/bin/tests

  windows_msvc_steam:
    name: windows_msvc_steam_x86_64
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up CMake and Ninja
        uses: lukka/get-cmake@v4.4.2
      # Key on the files that define the dependency set — precise invalidation.
      - name: Cache CPM sources
        uses: actions/cache@v6
        with:
          path: .cpm_cache
          key: cpm-windows_msvc_steam_x86_64-${{ hashFiles('cmake/ct_cpm.cmake', 'cmake/cpm/*.cmake') }}
          restore-keys: cpm-windows_msvc_steam_x86_64-
      - name: Build, test, and package with static CRT (/MT)
        run: cmake --workflow --preset windows_msvc_steam_x86_64_release_package
      # dumpbin comes from the MSVC environment; the gate script falls
      # back to objdump/llvm-objdump where dumpbin is absent.
      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
      - name: Static CRT gate — no VC++ redist imports
        run: cmake "-DTARGETS=build/windows_msvc_steam_x86_64/src;build/windows_msvc_steam_x86_64/tests;build/windows_msvc_steam_x86_64/_deps/sdl3-build" -P cmake/steampipe/check_pe_imports.cmake
      - name: Stage release assets
        shell: bash
        run: |
          cmake \
            -DBUILD_DIR="build/windows_msvc_steam_x86_64" \
            -DSTAGING_DIR="${RUNNER_TEMP}/release-assets" \
            -P cmake/scripts/stage_release_assets.cmake
      - name: Upload SteamPipe-ready depot archive
        uses: actions/upload-artifact@v7
        with:
          name: steam-depot-windows_msvc_steam_x86_64
          path: ${{ runner.temp }}/release-assets/
          if-no-files-found: error
          compression-level: 0

  windows_llvm_mingw_steam:
    name: linux_llvm_mingw_steam_x86_64_to_windows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up CMake and Ninja
        uses: lukka/get-cmake@v4.4.2
      - name: Cache LLVM MinGW
        uses: actions/cache@v6
        with:
          path: llvm_mingw
          key: llvm_mingw-${{ hashFiles('cmake/toolchains/llvm_mingw.cmake') }}
      # Key on the files that define the dependency set — precise invalidation.
      - name: Cache CPM sources
        uses: actions/cache@v6
        with:
          path: .cpm_cache
          key: cpm-windows_llvm_mingw_steam_x86_64-${{ hashFiles('cmake/ct_cpm.cmake', 'cmake/cpm/*.cmake') }}
          restore-keys: cpm-windows_llvm_mingw_steam_x86_64-
      - name: Build and package with static CRT
        run: cmake --workflow --preset windows_llvm_mingw_steam_x86_64_release_package
      # The denylist default (VC++ redist + MinGW runtime DLLs) lives in the script.
      - name: Static CRT gate — no runtime DLL imports
        run: cmake -DOBJDUMP=llvm_mingw/bin/llvm-objdump "-DTARGETS=build/windows_llvm_mingw_steam_x86_64/src;build/windows_llvm_mingw_steam_x86_64/tests;build/windows_llvm_mingw_steam_x86_64/_deps/sdl3-build" -P cmake/steampipe/check_pe_imports.cmake
      - name: Stage release assets
        run: |
          cmake \
            -DBUILD_DIR="build/windows_llvm_mingw_steam_x86_64" \
            -DSTAGING_DIR="${RUNNER_TEMP}/release-assets" \
            -P cmake/scripts/stage_release_assets.cmake
      - name: Upload SteamPipe-ready depot archive
        uses: actions/upload-artifact@v7
        with:
          name: steam-depot-windows_llvm_mingw_steam_x86_64
          path: ${{ runner.temp }}/release-assets/
          if-no-files-found: error
          compression-level: 0
