final boolean isLibrary = project.hasProperty('BUILD_AS_LIBRARY')
final boolean excludeNativeLibs = project.hasProperty('EXCLUDE_NATIVE_LIBS')

if (isLibrary) {
    apply plugin: libs.plugins.android.library.get().pluginId
} else {
    apply plugin: libs.plugins.android.application.get().pluginId
}

android {
    compileSdk = 37
    ndkVersion = '30.0.14904198 rc1'
    namespace = "com.egleba.app"
    buildToolsVersion = '37.0.0'

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    defaultConfig {
        if (!isLibrary) {
            applicationId = namespace
        }

        minSdk = 24
        targetSdk = 37
        versionCode = 1
        versionName = "1.0.0"

        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_PLATFORM=android-24",
                        "-DANDROID_STL=c++_shared",
                        "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON",
                        "-DCPM_SOURCE_CACHE=${System.getProperty('user.home')}/.cache/cpm-cmake"
            }
        }

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        testInstrumentationRunnerArguments clearPackageData: 'true'
    }

    buildFeatures {
        prefab = true
    }

    buildTypes {
        debug {
            debuggable = true
            jniDebuggable = true
            testCoverageEnabled = true
        }
        release {
            minifyEnabled = true
            shrinkResources = !isLibrary
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig = signingConfigs.debug

            ndk {
                debugSymbolLevel = 'SYMBOL_TABLE'
            }
        }
    }

    if (!excludeNativeLibs) {
        externalNativeBuild {
            cmake {
                path = file('../../CMakeLists.txt')
                version = "3.31.6+"
            }
        }
    }

    sourceSets {
        main {
            assets.srcDirs = ['../../assets']
            if (!excludeNativeLibs) {
                jniLibs.srcDirs = ['libs']
            }
        }
        androidTest {
            if (!excludeNativeLibs) {
                jniLibs.srcDirs = ['libs']
            }
        }
    }

    if (isLibrary) {
        libraryVariants.configureEach { variant ->
            variant.outputs.configureEach {
                if (outputFileName.endsWith('.aar')) {
                    outputFileName = "${project.name}-${variant.name}.aar"
                }
            }
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = false
        }
    }

    lint {
        abortOnError = false
        checkReleaseBuilds = false
    }

    testOptions {
        animationsDisabled = true
        // execution = 'ANDROIDX_TEST_ORCHESTRATOR'

        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
            all {
                it.testLogging {
                    events 'passed', 'skipped', 'failed', 'standardOut', 'standardError'
                    showStandardStreams = true
                    showCauses = true
                    showExceptions = true
                    showStackTraces = true
                }
            }
        }

        // Gradle Managed Devices — AOSP ATD (api 30 only, ATD limit)
        // docs: https://developer.android.com/studio/test/gradle-managed-devices
        managedDevices {
            localDevices {
                pixel6atd30 {
                    device = 'Pixel 6'
                    apiLevel = 30
                    systemImageSource = 'aosp-atd'
                    require64Bit = true
                }
            }
        }

        // Test report + result dirs (root build dir, single place)
        reportDir = "${rootProject.layout.buildDirectory.get().asFile}/test_reports/${project.name}"
        resultsDir = "${rootProject.layout.buildDirectory.get().asFile}/test_results/${project.name}"
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])

    androidTestImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.runner
    androidTestImplementation libs.rules

//    androidTestUtil           libs.orchestrator   // need orchestrator artifact for ANDROIDX_TEST_ORCHESTRATOR
}
